<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🛒 GIỎ HÀNG CỦA BẠN</h1>
    </header>

    <div class="nav-bar">
        <div id="user-info" class="user-area"></div>
        <a href="index.html" class="cart-icon">🏠 Tiếp tục mua sắm</a>
    </div>

    <div class="cart-container">
        <div id="cart-items"></div>
        
        <div class="cart-summary">
            <h3>💵 Tổng tiền: <span id="cart-total">0 VNĐ</span></h3>
            <button id="checkout-btn" class="btn-primary" onclick="goToCheckout()">✅ Tiến hành thanh toán</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Cửa hàng điện tử
    </footer>

    <script src="auth.js"></script>
    <script src="cart.js"></script>
    <script>
        function goToCheckout() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                alert('❌ Giỏ hàng trống! Vui lòng thêm sản phẩm trước.');
                return;
            }
            window.location.href = 'payment.html';
        }
    </script>
</body>
</html>
