<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Đơn Hàng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>📦 Đơn Hàng Đã Đặt</h1>
</header>

<main>
    <div style="text-align: right; margin-bottom: 20px;">
        <button onclick="xoaHetDonHang()" style="padding: 8px 16px; background: #dc2626; color: white; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px;">🗑️ Xóa tất cả</button>
        <a href="index.html" style="padding: 8px 16px; background: #b91c1c; color: white; border-radius: 5px; text-decoration: none;">🏠 Trang chủ</a>
    </div>

    <div id="danh-sach-don-hang"></div>
</main>

<script>
function taiDonHang() {
    const donHang = JSON.parse(localStorage.getItem('orderHistory')) || [];
    const noiDung = document.getElementById('danh-sach-don-hang');

    if (donHang.length === 0) {
        noiDung.innerHTML = '<div style="text-align:center; padding:50px; background:white; border-radius:10px;"><h3>📭 Chưa có đơn hàng nào</h3></div>';
        return;
    }

    noiDung.innerHTML = '';
    donHang.forEach(dh => {
        noiDung.innerHTML += `
            <div style="background:white; padding:20px; border-radius:10px; margin-bottom:15px; border-left:4px solid #b91c1c;">
                <h3>📦 Đơn hàng — ${dh.time}</h3>
                <p><strong>Người nhận:</strong> ${dh.customer.name}</p>
                <p><strong>SĐT:</strong> ${dh.customer.phone}</p>
                <p><strong>Địa chỉ:</strong> ${dh.customer.address}</p>
                <p><strong>Thanh toán:</strong> ${dh.paymentMethod === 'cod' ? 'Tiền mặt khi nhận hàng' : dh.paymentMethod === 'bank' ? 'Chuyển khoản' : 'Thẻ'}</p>
                <p><strong>Sản phẩm:</strong></p>
                <ul>
                    ${dh.items.map(i => `<li>${i.name} × ${i.quantity} — ${i.price}</li>`).join('')}
                </ul>
                <p style="font-size:18px; font-weight:bold; color:#b91c1c;">💰 Tổng: ${dh.total.toLocaleString('vi-VN')} VNĐ</p>
            </div>
        `;
    });
}

function xoaHetDonHang() {
    if (confirm('Xóa hết đơn hàng?')) {
        localStorage.removeItem('orderHistory');
        taiDonHang();
    }
}

taiDonHang();
</script>

</body>
</html>
